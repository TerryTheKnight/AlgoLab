name: Bug report
description: Report a reproducible problem in AlgoLab.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please include enough detail to reproduce the issue. Do not include private data.
  - type: input
    id: page
    attributes:
      label: Page or algorithm
      placeholder: Sorting Lab — Merge Sort
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the inputs and actions that lead to the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
    validations:
      required: false
